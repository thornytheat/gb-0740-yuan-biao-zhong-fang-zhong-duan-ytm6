services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-18429}:8000"
    environment:
      ADMISSION_DB: /state/admission.sqlite3
    volumes:
      - admission-data:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  admission-data:
