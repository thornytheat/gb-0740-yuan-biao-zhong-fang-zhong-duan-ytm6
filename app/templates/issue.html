{% extends 'base.html' %}
{% from 'lines.jinja' import panel %}

<section class="panel output"><h2>近期签发</h2><ul class="versions">{% for item in latest %}<li><a href="{{ url_for('console',section='issue',plan=item['编号']) }}">{{ item['编号'] }}</a> · 上线 {{ item['上线日'] }}</li>{% endfor %}</ul></section>
{% endblock %}
